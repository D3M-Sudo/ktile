name: Rust CI

on:
  push:
    branches: [main, development, testing, "feature/**", "k-tile-rust-rebuild"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, tests, and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core and X11 adapter
        run: cargo test --all-features --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Check resolved dependency license metadata
        run: python3 scripts/check_dependency_licenses.py
      - name: Release build
        run: cargo build --release --all-features --locked
      - name: Install isolated X11 test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb openbox x11-utils xdotool
      - name: Run isolated X11 integration smoke test
        run: bash scripts/test-x11-integration.sh
