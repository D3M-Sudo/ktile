name: CI

concurrency:
  group: ktile-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature, feature-complete-roadmap, main, development]
  pull_request:
    branches: [feature, main, development]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install X11 build deps
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libx11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install X11 test deps
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox x11-apps libxcb1-dev libx11-dev
      - run: cargo test
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: M3 layout line coverage report
        run: cargo llvm-cov --all-targets --json --output-path coverage.json
      - name: Enforce M3 layout line coverage (minimum 80%)
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("coverage.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          files = [
              item for item in report["data"][0]["files"]
              if "/src/layout/" in item["filename"].replace("\\\\", "/")
          ]
          if not files:
              print("ERROR: coverage report contains no src/layout/ files")
              sys.exit(1)

          lines_found = sum(item["summary"]["lines"]["count"] for item in files)
          lines_hit = sum(item["summary"]["lines"]["covered"] for item in files)
          percentage = 100.0 * lines_hit / lines_found if lines_found else 100.0
          print(f"src/layout line coverage: {lines_hit}/{lines_found} = {percentage:.2f}%")
          sys.exit(0 if percentage >= 80.0 else 1)
          PY
      - name: X11 integration (isolated Xvfb per test)
        # NOTA: niente xvfb-run esterno — i test avviano Xvfb isolati su :97/:98/:99.
        # xvfb-run occuperebbe :99 e farebbe fallire test_xvfb_openbox_reading_and_events
        # ("Server is already active for display 99").
        # --test-threads=1: i test manipolano DISPLAY (env globale), in parallelo si pestano.
        run: cargo test --test x11_integration -- --ignored --nocapture --test-threads=1
      - name: Manual geometry applier integration (Xvfb)
        run: cargo test --test applier_integration -- --ignored --nocapture --test-threads=1
